<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sk Masum Software Engineer Resume</title>
  <desc id="desc">Resume preview card with name and role on a bright green gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f16a"/>
      <stop offset="100%" stop-color="#7cb8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(90 105)">
    <rect x="0" y="0" width="1020" height="420" rx="28" fill="#ffffff" fill-opacity="0.94"/>
    <text x="72" y="165" font-family="Open Sans, Arial, sans-serif" font-size="68" font-weight="700" fill="#111827">
      Sk Masum
    </text>
    <text x="72" y="245" font-family="Open Sans, Arial, sans-serif" font-size="40" font-weight="600" fill="#334155">
      Software Engineer
    </text>
    <text x="72" y="320" font-family="Open Sans, Arial, sans-serif" font-size="30" fill="#475569">
      Resume · Projects · Skills · Experience
    </text>
    <rect x="72" y="360" width="280" height="10" rx="5" fill="#84cc16"/>
  </g>
</svg>
